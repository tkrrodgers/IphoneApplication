# XcodeGen spec for the Logsperity iPhone app. Generate the project with:  cd ios && xcodegen
# The generated Logsperity.xcodeproj is not committed; this file is the source of truth.
name: Logsperity
options:
  bundleIdPrefix: com.prosperitysimplified
  deploymentTarget:
    iOS: "26.0"
  developmentLanguage: en
packages:
  LogsperityCore:
    path: LogsperityCore
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Set to your Apple Developer Team ID once enrollment is approved (Xcode → Settings → Accounts).
    DEVELOPMENT_TEAM: C893FXP2G4
targets:
  Logsperity:
    type: application
    platform: iOS
    sources:
      - path: Logsperity
    dependencies:
      - package: LogsperityCore
    info:
      path: Logsperity/Info.plist
      properties:
        CFBundleDisplayName: Logsperity
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.business
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSMicrophoneUsageDescription: Logsperity uses the microphone when you tap the mic to talk to HERB.
        NSSpeechRecognitionUsageDescription: HERB turns what you say into log entries. Speech is recognized on your iPhone when possible.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prosperitysimplified.logsperity
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
  # Narrated training tour (not shipped): drives the app in the simulator. Run demo/run-demo.sh.
  LogsperityDemo:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LogsperityDemo
    dependencies:
      - target: Logsperity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.prosperitysimplified.logsperity.demo
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
schemes:
  Logsperity:
    build:
      targets:
        Logsperity: all
    run:
      config: Debug
    archive:
      config: Release
  LogsperityDemo:
    build:
      targets:
        Logsperity: all
        LogsperityDemo: [test]
    test:
      config: Debug
      targets:
        - LogsperityDemo
